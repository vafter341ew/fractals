<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151a22">
  <title>IFS Fractal Studio</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #667085;
      --line: #e5e7eb;
      --paper: #ffffff;
      --canvas: #f7f8fa;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger: #c2410c;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef0f3;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
    }
    .sidebar {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-title span { color: var(--accent); }
    .icon-button {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
      font-size: 20px;
    }
    .icon-button:hover { border-color: #c7cad1; background: #fafafa; }
    .icon-button:disabled { opacity: 0.35; cursor: not-allowed; }
    .controls { padding: 18px 22px 28px; }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 112px;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .control-row label, .group-label { font-size: 13px; font-weight: 750; }
    select, input[type="number"], input[type="range"] {
      width: 100%;
    }
    select {
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--ink);
    }
    input[type="range"] { accent-color: var(--accent); }
    .range-value {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0 22px;
    }
    .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--ink);
      font-weight: 750;
      font-size: 13px;
    }
    .button:hover { background: #fafafa; border-color: #c9ccd3; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .button.primary:hover { background: #4338ca; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    #transformations { display: grid; gap: 10px; }
    .transform-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .transform-card-header {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .transform-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .transform-name { flex: 1; font-size: 13px; font-weight: 800; }
    .remove-button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #98a0ad;
      font-size: 20px;
    }
    .remove-button:hover { background: #fff1f0; color: var(--danger); }
    .remove-button:disabled { opacity: 0.25; cursor: not-allowed; }
    .transform-body { padding: 10px 12px 12px; }
    .coefficient-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .coefficient { display: grid; gap: 4px; }
    .coefficient label { color: var(--muted); font-size: 11px; font-weight: 800; }
    .coefficient input {
      min-width: 0;
      height: 36px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fafafa;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .probability-row {
      display: grid;
      grid-template-columns: 78px 1fr 54px;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .probability-row label { font-size: 12px; font-weight: 700; }
    .probability-row input[type="number"] {
      height: 34px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 12px;
    }
    .probability-value {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .warning {
      display: none;
      margin: 10px 0;
      padding: 9px 10px;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
    }
    .warning.show { display: block; }
    .workspace {
      min-width: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: 76px minmax(0, 1fr);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.94);
    }
    .topbar h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.025em;
    }
    .top-actions { display: flex; gap: 8px; }
    .top-actions .button { padding: 0 13px; }
    .stage {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 14px;
      padding: 14px;
      background: var(--canvas);
    }
    .canvas-panel, .stats-panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      box-shadow: 0 5px 20px rgba(30, 41, 59, 0.04);
    }
    .canvas-panel {
      position: relative;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      cursor: grab;
      touch-action: none;
    }
    canvas.dragging { cursor: grabbing; }
    .canvas-status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      min-height: 30px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .stats-panel { padding: 16px; overflow-y: auto; }
    .stats-panel h2 {
      margin: 0 0 14px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-block { margin-bottom: 16px; }
    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 21px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .distribution { display: grid; gap: 9px; }
    .distribution-row { display: grid; gap: 5px; }
    .distribution-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .bar { height: 5px; border-radius: 99px; background: #edf0f4; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      transform: translateY(20px);
      opacity: 0;
      max-width: 320px;
      padding: 11px 14px;
      border-radius: 9px;
      background: #202634;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      font-size: 13px;
      pointer-events: none;
      transition: 160ms ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 310px minmax(0, 1fr); }
      .stage { grid-template-columns: 1fr 170px; }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar {
        height: auto;
        position: relative;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .workspace { height: auto; grid-template-rows: 64px 760px; }
      .topbar { padding: 0 14px; }
      .topbar h1 { font-size: 16px; }
      .top-actions .button { padding: 0 9px; }
      .stage { grid-template-columns: 1fr; grid-template-rows: 520px auto; }
      .stats-panel { min-height: 180px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">IFS <span>Fractal Studio</span></div>
      </div>
      <div class="controls">
        <div class="control-row">
          <label for="preset">Preset</label>
          <select id="preset">
            <option value="sierpinski">Sierpinski</option>
            <option value="barnsley">Barnsley Fern</option>
            <option value="dragon">Dragon-like</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="control-row">
          <label for="points">Points</label>
          <div>
            <input type="range" id="points" min="1000" max="50000" value="12000" step="1000">
            <div class="range-value" id="pointsValue">12,000</div>
          </div>
        </div>
        <div class="control-row">
          <label for="seed">Random seed</label>
          <input type="number" id="seed" value="311" min="0" max="999999" style="height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px">
        </div>
        <div class="toolbar">
          <button class="button" id="randomize">Randomize</button>
          <button class="button primary" id="resetView">Reset view</button>
        </div>
        <div class="warning" id="probabilityWarning" role="alert">All probabilities are zero. Give at least one transformation a positive weight.</div>
        <div class="section-heading">
          <h2>Transformations</h2>
          <button class="icon-button" id="addTransform" title="Add transformation" aria-label="Add transformation">+</button>
        </div>
        <div id="transformations"></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <h1>Fractal canvas</h1>
        <div class="top-actions">
          <button class="button" id="copyConfig">Copy config</button>
          <button class="button" id="pasteConfig">Paste config</button>
          <button class="button primary" id="exportPng">Export PNG</button>
        </div>
      </header>
      <div class="stage">
        <div class="canvas-panel">
          <canvas id="fractalCanvas" aria-label="Generated iterated function system fractal"></canvas>
          <div class="canvas-status" id="canvasStatus">Preparing render...</div>
        </div>
        <aside class="stats-panel">
          <h2>Statistics</h2>
          <div class="stat-block">
            <span class="stat-label">Points rendered</span>
            <span class="stat-value" id="pointCount">—</span>
          </div>
          <div class="stat-block">
            <span class="stat-label">Hausdorff Dimension</span>
            <span class="stat-value" id="dimension">—</span>
          </div>
          <div class="stat-block">
            <span class="stat-label">Transform distribution</span>
            <div class="distribution" id="distribution"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const palette = [
      "#ef4444", "#2563eb", "#16a34a", "#d97706", "#9333ea", "#0891b2",
      "#db2777", "#65a30d", "#ea580c", "#4f46e5", "#0f766e", "#be123c"
    ];

    const presets = {
      sierpinski: [
        {a:.5,b:0,c:0,d:.5,e:0,f:0,p:33.333},
        {a:.5,b:0,c:0,d:.5,e:.5,f:0,p:33.333},
        {a:.5,b:0,c:0,d:.5,e:.25,f:.432,p:33.334}
      ],
      barnsley: [
        {a:0,b:0,c:0,d:.16,e:0,f:0,p:1},
        {a:.85,b:.04,c:-.04,d:.85,e:0,f:1.6,p:85},
        {a:.2,b:-.26,c:.23,d:.22,e:0,f:1.6,p:7},
        {a:-.15,b:.28,c:.26,d:.24,e:0,f:.44,p:7}
      ],
      dragon: [
        {a:.5,b:-.5,c:.5,d:.5,e:0,f:0,p:50},
        {a:-.5,b:-.5,c:.5,d:-.5,e:1,f:0,p:50}
      ]
    };

    let transforms = cloneTransforms(presets.sierpinski);
    let renderTimer = null;
    let toastTimer = null;
    let viewZoom = 1;
    let viewPanX = 0;
    let viewPanY = 0;
    let viewCache = null;

    const canvas = document.getElementById("fractalCanvas");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("transformations");

    function cloneTransforms(items) {
      return items.map(t => ({...t}));
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function probabilitySum() {
      return transforms.reduce((sum, t) => sum + Math.max(0, Number(t.p) || 0), 0);
    }

    function normalizedProbabilities() {
      const sum = probabilitySum();
      return sum > 0
        ? transforms.map(t => Math.max(0, Number(t.p) || 0) / sum)
        : new Array(transforms.length).fill(0);
    }

    function renderCards() {
      container.innerHTML = "";
      const normalized = normalizedProbabilities();
      transforms.forEach((t, i) => {
        const card = document.createElement("div");
        card.className = "transform-card";
        card.innerHTML = `
          <div class="transform-card-header">
            <span class="transform-dot" style="background:${palette[i % palette.length]}"></span>
            <span class="transform-name">Transformation ${i + 1}</span>
            <button class="remove-button" data-remove="${i}" title="Remove transformation" aria-label="Remove transformation ${i + 1}" ${transforms.length === 1 ? "disabled" : ""}>−</button>
          </div>
          <div class="transform-body">
            <div class="coefficient-grid">
              ${["a","b","c","d","e","f"].map(key => `
                <div class="coefficient">
                  <label for="${key}-${i}">${key}</label>
                  <input id="${key}-${i}" data-index="${i}" data-key="${key}" type="number" value="${t[key]}" step="0.01">
                </div>
              `).join("")}
            </div>
            <div class="probability-row">
              <label for="prob-${i}">Probability</label>
              <input id="prob-${i}" data-index="${i}" data-probability type="number" value="${Number(t.p).toFixed(t.p % 1 ? 3 : 0)}" min="0" step="1">
              <span class="probability-value">${normalized.length && normalized[i] ? (normalized[i] * 100).toFixed(1) : "0"}%</span>
            </div>
          </div>`;
        container.appendChild(card);
      });

      container.querySelectorAll("[data-key]").forEach(input => {
        input.addEventListener("input", () => {
          const i = Number(input.dataset.index);
          const value = parseFloat(input.value);
          if (Number.isFinite(value)) transforms[i][input.dataset.key] = value;
          document.getElementById("preset").value = "custom";
          scheduleRender();
        });
      });
      container.querySelectorAll("[data-probability]").forEach(input => {
        input.addEventListener("input", () => {
          const i = Number(input.dataset.index);
          const value = Math.max(0, parseFloat(input.value) || 0);
          transforms[i].p = value;
          updateProbabilityDisplays();
          document.getElementById("preset").value = "custom";
          scheduleRender();
        });
      });
      container.querySelectorAll("[data-remove]").forEach(button => {
        button.addEventListener("click", () => removeTransformation(Number(button.dataset.remove)));
      });
      updateProbabilityDisplays();
    }

    function updateProbabilityDisplays() {
      const normalized = normalizedProbabilities();
      document.getElementById("probabilityWarning").classList.toggle("show", probabilitySum() === 0);
      transforms.forEach((t, i) => {
        const row = document.getElementById(`prob-${i}`);
        if (row) {
          const value = row.parentElement.querySelector(".probability-value");
          value.textContent = `${normalized[i] ? (normalized[i] * 100).toFixed(1) : "0"}%`;
        }
      });
    }

    function addTransformation() {
      if (transforms.length >= 50) {
        showToast("Maximum of 50 transformations reached.");
        return;
      }
      const count = transforms.length;
      const weight = count ? Math.max(1, 100 / (count + 1)) : 100;
      transforms.push({a:.5,b:0,c:0,d:.5,e:0,f:0,p:weight});
      document.getElementById("preset").value = "custom";
      renderCards();
      scheduleRender();
    }

    function removeTransformation(index) {
      if (transforms.length === 1) return;
      transforms.splice(index, 1);
      document.getElementById("preset").value = "custom";
      renderCards();
      scheduleRender();
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      document.getElementById("canvasStatus").textContent = "Updating...";
      renderTimer = setTimeout(renderFractal, 180);
    }

    function estimateSpectralDimension() {
      let averageRadius = 0;
      for (const t of transforms) {
        const trace = t.a + t.d;
        const determinant = t.a * t.d - t.b * t.c;
        const discriminant = trace * trace - 4 * determinant;
        let radius;
        if (discriminant >= 0) {
          radius = Math.max(Math.abs((trace + Math.sqrt(discriminant)) / 2),
                            Math.abs((trace - Math.sqrt(discriminant)) / 2));
        } else {
          radius = Math.sqrt(Math.abs(determinant));
        }
        averageRadius += Math.abs(radius);
      }
      averageRadius /= transforms.length;
      if (averageRadius >= 1 || averageRadius < 1e-10) return null;
      return Math.log(transforms.length) / Math.log(1 / averageRadius);
    }

    function redrawFractal() {
      if (!viewCache) return;
      const {plotPoints, rectWidth, rectHeight, scale, centerX, centerY} = viewCache;
      const viewScale = scale * viewZoom;
      ctx.setTransform(Math.min(window.devicePixelRatio || 1, 2), 0, 0, Math.min(window.devicePixelRatio || 1, 2), 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rectWidth, rectHeight);

      for (const point of plotPoints) {
        if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) continue;
        const px = rectWidth / 2 + viewPanX + (point.x - centerX) * viewScale;
        const py = rectHeight / 2 + viewPanY - (point.y - centerY) * viewScale;
        ctx.fillStyle = palette[point.transform % palette.length];
        ctx.globalAlpha = 0.72;
        ctx.fillRect(px, py, 1.25, 1.25);
      }
      ctx.globalAlpha = 1;
    }

    function resetView() {
      viewZoom = 1;
      viewPanX = 0;
      viewPanY = 0;
      redrawFractal();
      showToast("View reset.");
    }

    function renderFractal() {
      if (probabilitySum() === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById("canvasStatus").textContent = "Add a positive probability";
        document.getElementById("pointCount").textContent = "0";
        document.getElementById("dimension").textContent = "—";
        document.getElementById("distribution").innerHTML = "";
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const seed = parseInt(document.getElementById("seed").value, 10);
      const random = mulberry32(Number.isFinite(seed) ? seed : 311);
      const count = parseInt(document.getElementById("points").value, 10);
      const probabilities = normalizedProbabilities();
      const cumulative = [];
      let running = 0;
      for (const p of probabilities) {
        running += p;
        cumulative.push(running);
      }

      let x = 0, y = 0;
      const plotPoints = [];
      const used = new Array(transforms.length).fill(0);
      for (let i = 0; i < count + 100; i++) {
        const r = random();
        let selected = 0;
        for (let j = 0; j < cumulative.length; j++) {
          if (r < cumulative[j]) { selected = j; break; }
        }
        const t = transforms[selected];
        const nextX = t.a * x + t.b * y + t.e;
        const nextY = t.c * x + t.d * y + t.f;
        x = nextX;
        y = nextY;
        if (i >= 100) {
          plotPoints.push({x, y, transform: selected});
          used[selected]++;
        }
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const point of plotPoints) {
        if (Number.isFinite(point.x) && Number.isFinite(point.y)) {
          minX = Math.min(minX, point.x);
          maxX = Math.max(maxX, point.x);
          minY = Math.min(minY, point.y);
          maxY = Math.max(maxY, point.y);
        }
      }
      if (!Number.isFinite(minX) || maxX === minX || maxY === minY) {
        document.getElementById("canvasStatus").textContent = "Fractal collapsed or contains invalid values";
        return;
      }

      const pad = 28;
      const width = rect.width - pad * 2;
      const height = rect.height - pad * 2;
      const scale = Math.min(width / (maxX - minX), height / (maxY - minY));
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      viewCache = {plotPoints, rectWidth: rect.width, rectHeight: rect.height, scale, centerX, centerY};
      redrawFractal();

      const dim = estimateSpectralDimension();
      document.getElementById("pointCount").textContent = count.toLocaleString();
      document.getElementById("dimension").textContent = dim === null ? "—" : dim.toFixed(4);
      document.getElementById("canvasStatus").textContent =
        `${count.toLocaleString()} points · seed ${Number.isFinite(seed) ? seed : 311} · scroll to zoom · drag to pan`;

      const distribution = document.getElementById("distribution");
      distribution.innerHTML = "";
      transforms.forEach((t, i) => {
        const pct = used.reduce((a,b) => a+b,0) ? used[i] / used.reduce((a,b) => a+b,0) : 0;
        distribution.insertAdjacentHTML("beforeend", `
          <div class="distribution-row">
            <div class="distribution-meta">
              <span>T${i + 1}</span>
              <span>${used[i].toLocaleString()} · ${(pct * 100).toFixed(1)}%</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct * 100}%;background:${palette[i % palette.length]}"></div></div>
          </div>`);
      });
    }

    function loadPreset(name) {
      if (!presets[name]) return;
      transforms = cloneTransforms(presets[name]);
      renderCards();
      scheduleRender();
    }

    function randomizeTransformations() {
      transforms = transforms.map(() => ({
        a:+(Math.random() * 1.8 - 0.9).toFixed(3),
        b:+(Math.random() * 1.8 - 0.9).toFixed(3),
        c:+(Math.random() * 1.8 - 0.9).toFixed(3),
        d:+(Math.random() * 1.8 - 0.9).toFixed(3),
        e:+(Math.random() * 1.8 - 0.9).toFixed(3),
        f:+(Math.random() * 1.8 - 0.9).toFixed(3),
        p:1
      }));
      document.getElementById("preset").value = "custom";
      renderCards();
      scheduleRender();
    }

    function getConfig() {
      return {
        name: "IFS Fractal Studio",
        seed: parseInt(document.getElementById("seed").value, 10) || 311,
        points: parseInt(document.getElementById("points").value, 10),
        transforms
      };
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    async function copyConfig() {
      const text = JSON.stringify(getConfig(), null, 2);
      try {
        await navigator.clipboard.writeText(text);
        showToast("Configuration copied.");
      } catch (_) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        showToast("Configuration copied.");
      }
    }

    async function pasteConfig() {
      let text = "";
      try {
        text = await navigator.clipboard.readText();
      } catch (_) {
        text = window.prompt("Paste a copied IFS configuration JSON:");
      }
      if (!text) return;
      applyConfig(text);
    }

    function applyConfig(value) {
      try {
        const config = JSON.parse(value);
        if (!Array.isArray(config.transforms) || !config.transforms.length) {
          throw new Error("Missing transformations");
        }
        transforms = config.transforms.map(t => ({
          a:Number(t.a)||0, b:Number(t.b)||0, c:Number(t.c)||0,
          d:Number(t.d)||0, e:Number(t.e)||0, f:Number(t.f)||0,
          p:Number(t.p) >= 0 ? Number(t.p) : 1
        }));
        if (Number.isFinite(Number(config.seed))) document.getElementById("seed").value = config.seed;
        if (Number.isFinite(Number(config.points))) {
          document.getElementById("points").value = config.points;
          document.getElementById("pointsValue").textContent = Number(config.points).toLocaleString();
        }
        document.getElementById("preset").value = "custom";
        renderCards();
        scheduleRender();
        showToast("Configuration pasted.");
      } catch (_) {
        showToast("This configuration is invalid.");
      }
    }

    document.getElementById("addTransform").addEventListener("click", addTransformation);
    document.getElementById("randomize").addEventListener("click", randomizeTransformations);
    document.getElementById("resetView").addEventListener("click", resetView);
    document.getElementById("preset").addEventListener("change", event => loadPreset(event.target.value));
    document.getElementById("points").addEventListener("input", event => {
      document.getElementById("pointsValue").textContent = Number(event.target.value).toLocaleString();
      scheduleRender();
    });
    document.getElementById("seed").addEventListener("input", scheduleRender);
    document.getElementById("copyConfig").addEventListener("click", copyConfig);
    document.getElementById("pasteConfig").addEventListener("click", pasteConfig);
    document.getElementById("exportPng").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "ifs-fractal.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("PNG export started.");
    });

    canvas.addEventListener("wheel", event => {
      if (!viewCache) return;
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;
      const beforeZoom = viewZoom;
      const zoomFactor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
      viewZoom = Math.max(0.5, Math.min(25, viewZoom * zoomFactor));
      const ratio = viewZoom / beforeZoom;

      const dx = mouseX - rect.width / 2 - viewPanX;
      const dy = mouseY - rect.height / 2 - viewPanY;
      viewPanX -= dx * (1 - ratio);
      viewPanY -= dy * (1 - ratio);
      redrawFractal();
    }, {passive: false});

    let dragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragPanX = 0;
    let dragPanY = 0;
    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragPanX = viewPanX;
      dragPanY = viewPanY;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;
      viewPanX = dragPanX + event.clientX - dragStartX;
      viewPanY = dragPanY + event.clientY - dragStartY;
      redrawFractal();
    });
    canvas.addEventListener("pointerup", event => {
      dragging = false;
      canvas.classList.remove("dragging");
      canvas.releasePointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointercancel", () => {
      dragging = false;
      canvas.classList.remove("dragging");
    });
    canvas.addEventListener("dblclick", event => {
      if (!viewCache) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;
      const beforeZoom = viewZoom;
      viewZoom = Math.min(25, viewZoom * 1.5);
      const ratio = viewZoom / beforeZoom;
      const dx = mouseX - rect.width / 2 - viewPanX;
      const dy = mouseY - rect.height / 2 - viewPanY;
      viewPanX -= dx * (1 - ratio);
      viewPanY -= dy * (1 - ratio);
      redrawFractal();
    });

    window.addEventListener("resize", () => scheduleRender());
    document.getElementById("seed").value = Math.floor(Math.random() * 1000);
    renderCards();
    requestAnimationFrame(() => renderFractal());
  </script>
</body>
</html>
